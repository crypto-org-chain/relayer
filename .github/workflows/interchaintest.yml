name: TESTING - interchaintest

on:
  pull_request:

# The other interchaintest suites (conformance, misbehaviour, fee middleware, fee grant and the
# remaining TestScenario* tests) need ghcr.io/strangelove-ventures/heighliner chain images, which
# no longer allow anonymous pulls, so CI only runs the tests whose images are public.
jobs:
  scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestScenarioICAChannelClose
          - TestScenarioInterchainAccounts

    steps:
      - name: checkout relayer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: interchaintest/go.mod
          cache-dependency-path: |
            go.sum
            interchaintest/go.sum

      - name: interchaintest
        run: |
          cd interchaintest
          go test -timeout 30m -race -v -run '^${{ matrix.test }}$' .
