name: TESTING - interchaintest

on:
  pull_request:

# CI only runs the suites that need no chain image or only public ones (ghcr.io/cosmos/ibc-go-*). The gaia,
# osmosis, juno and kujira suites need ghcr.io/strangelove-ventures/heighliner images, which no longer allow anonymous pulls.
jobs:
  scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestAccCacheBugfix
          - TestLocalhost_InterchainAccounts
          - TestLocalhost_TokenTransfers
          - TestMemoAndReceiverLimit
          - TestScenarioICAChannelClose
          - TestScenarioInterchainAccounts

    steps:
      - name: checkout relayer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: interchaintest/go.mod
          cache-dependency-path: |
            go.sum
            interchaintest/go.sum

      - name: interchaintest
        run: |
          cd interchaintest
          go test -timeout 30m -race -v -run '^${{ matrix.test }}$' .
