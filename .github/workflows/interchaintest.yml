name: TESTING - interchaintest

on:
  pull_request:

# The heighliner gaia, osmosis, juno and kujira images no longer allow anonymous pulls, so
# interchaintest/chains.yaml points those chains at images their projects publish.
jobs:
  scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestAccCacheBugfix
          - TestLocalhost_InterchainAccounts
          - TestLocalhost_TokenTransfers
          - TestMemoAndReceiverLimit
          - TestRelayerEventProcessor
          - TestRelayerFeeGrant
          - TestRelayerFeeGrantExternal
          - TestRelayerFeeMiddleware
          - TestRelayerLegacyProcessor
          - TestRelayerMisbehaviourDetection
          - TestRelayerMultiplePathsSingleProcess
          - TestScenarioClientThresholdUpdate
          - TestScenarioClientTrustingPeriodUpdate
          - TestScenarioICAChannelClose
          - TestScenarioInterchainAccounts
          - TestScenarioPathFilterAllow
          - TestScenarioPathFilterDeny
          - TestScenarioTendermint37Boundary

    steps:
      - name: checkout relayer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: interchaintest/go.mod
          cache-dependency-path: |
            go.sum
            interchaintest/go.sum

      - name: interchaintest
        run: |
          cd interchaintest
          go test -timeout 30m -race -v -run '^${{ matrix.test }}$' .

  local-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: checkout relayer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build local.Dockerfile
        run: docker build -f local.Dockerfile -t relayer:local .

      - name: run rly from the image
        run: docker run --rm relayer:local rly version
