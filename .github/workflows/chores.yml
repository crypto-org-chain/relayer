name: chores

on:
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gaurav-nelson/github-action-markdown-link-check@1.0.15

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run codespell
        continue-on-error: true
        run: |
          # .codespellrc is used
          sudo apt-get install codespell -y
          codespell -w --config .codespellrc
          exit $?

  pr-title-format:
    name: Lint PR Title
    permissions:
      pull-requests: read
      statuses: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # This fork titles PRs "Problem: ..."; conventional commit types stay allowed.
          types: |
            Problem
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
