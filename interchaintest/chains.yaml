# Built-in chain configs for the chains these tests use, replacing interchaintest's embedded
# configuredChains.yaml. The heighliner gaia, osmosis, juno and kujira images no longer allow
# anonymous pulls, so those chains point at images their projects publish. ChainSpec.Version
# selects the tag in each repository below. Loaded through IBCTEST_CONFIGURED_CHAINS (see main_test.go).

gaia:
  name: gaia
  type: cosmos
  bin: gaiad
  bech32-prefix: cosmos
  denom: uatom
  gas-prices: 0.01uatom
  # Gaia v19+ uses about 31% more gas to deliver some IBC client txs (MsgSubmitMisbehaviour, MsgCreateClient) than it simulates.
  # Set here because a ChainSpec's GasAdjustment cannot override a non-zero built-in value.
  gas-adjustment: 1.5
  trusting-period: 504h
  images:
    - repository: ghcr.io/cosmos/gaia
      uid-gid: 1025:1025
  no-host-mount: false

ibc-go-simd:
  name: ibc-go-simd
  type: cosmos
  bin: simd
  bech32-prefix: cosmos
  denom: photon
  gas-prices: 0.0photon
  gas-adjustment: 1.2
  trusting-period: 504h
  images:
    - repository: ghcr.io/strangelove-ventures/heighliner/ibc-go-simd
      uid-gid: 1025:1025
  no-host-mount: false

